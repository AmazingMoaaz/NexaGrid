<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="60%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#00E5CC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0A0E1A"/>

  <g transform="translate(22, 22)">
    <!-- Grid lines — horizontal -->
    <line x1="0" y1="0" x2="42" y2="0" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="42" y1="0" x2="84" y2="0" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="0" y1="42" x2="42" y2="42" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="42" y1="42" x2="84" y2="42" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="0" y1="84" x2="42" y2="84" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="42" y1="84" x2="84" y2="84" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

    <!-- Grid lines — vertical -->
    <line x1="0" y1="0" x2="0" y2="84" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="42" y1="0" x2="42" y2="84" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <line x1="84" y1="0" x2="84" y2="84" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

    <!-- Diagonal accents -->
    <line x1="0" y1="0" x2="42" y2="42" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="42" y1="42" x2="84" y2="84" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

    <!-- Corner + edge nodes — ring -->
    <circle cx="0" cy="0" r="5.5" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>
    <circle cx="42" cy="0" r="5.5" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>
    <circle cx="84" cy="0" r="5.5" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="42" r="5.5" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>
    <circle cx="84" cy="42" r="5.5" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="84" r="5.5" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>
    <circle cx="42" cy="84" r="5.5" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>
    <circle cx="84" cy="84" r="5.5" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>

    <!-- Corner + edge nodes — dot -->
    <circle cx="0" cy="0" r="2.5" fill="url(#g1)"/>
    <circle cx="42" cy="0" r="2.5" fill="url(#g1)"/>
    <circle cx="84" cy="0" r="2.5" fill="url(#g1)"/>
    <circle cx="0" cy="42" r="2.5" fill="url(#g1)"/>
    <circle cx="84" cy="42" r="2.5" fill="url(#g1)"/>
    <circle cx="0" cy="84" r="2.5" fill="url(#g1)"/>
    <circle cx="42" cy="84" r="2.5" fill="url(#g1)"/>
    <circle cx="84" cy="84" r="2.5" fill="url(#g1)"/>

    <!-- Center hub — larger, brighter -->
    <circle cx="42" cy="42" r="9" fill="none" stroke="url(#g2)" stroke-width="2.5" opacity="0.8"/>
    <circle cx="42" cy="42" r="4.5" fill="url(#g2)"/>
  </g>
</svg>
